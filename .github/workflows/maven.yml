name: Java CI/CD with Maven

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    # 1. Code clone (Checkout step)
    - name: Checkout code
      uses: actions/checkout@v4

    # 2. Setup JDK (Since Maven requires Java)
    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '21'

    # 3. Setup specific Maven version
    - name: Set up Maven
      uses: stCarver/setup-maven@v5
      with:
        maven-version: '3.9.10'

    # 4. Build the dev code
    - name: Build with Maven
      run: mvn clean install

    # 5. Archive Test Reports & Artifacts
    - name: Upload Test Reports
      if: success()
      uses: actions/upload-artifact@v4
      with:
        name: surefire-reports
        path: '**/target/surefire-reports/TEST-*.xml'

    - name: Upload JAR Artifact
      if: success()
      uses: actions/upload-artifact@v4
      with:
        name: app-jar
        path: target/*.jar
